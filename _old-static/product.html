<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — BinAr Fabrics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230f4c3a'/><text x='50' y='68' font-family='Georgia' font-size='54' text-anchor='middle' fill='%23c9a24a'>B</text></svg>">
</head>
<body data-page="product">

  <section class="section section--tight">
    <div class="container">
      <nav class="breadcrumbs" id="crumbs" style="margin-bottom:28px"></nav>
      <div class="product" id="product"></div>
    </div>
  </section>

  <section class="section section--cream">
    <div class="container">
      <div class="section-head"><div><span class="eyebrow">Complete the look</span><h2>You may also like</h2></div><a class="link-arrow" id="relatedLink" href="shop.html">View more <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
      <div class="product-grid" id="related"></div>
    </div>
  </section>

  <script src="js/products.js"></script>
  <script>
    window.binarPage = function ({ PRODUCTS, swatch, productCard, priceHtml, money, byId, catName, getWishlist, $, $$ }) {
      const id = new URLSearchParams(location.search).get("id");
      const p = byId(id) || PRODUCTS[0];
      document.title = `${p.name} — BinAr Fabrics`;

      $("#crumbs").innerHTML = `<a href="index.html">Home</a><span>/</span><a href="shop.html?cat=${p.category}">${catName(p.category)}</a><span>/</span><a href="shop.html?fabric=${encodeURIComponent(p.fabric)}">${p.fabric}</a><span>/</span><span>${p.name}</span>`;

      // Gallery: main swatch + variants that mimic multiple product photos
      const views = [
        { ...p },
        { ...p, pattern: "plain" },
        { ...p, colors: [...p.colors].reverse() },
        { ...p, pattern: "stripe" }
      ];
      const stars = "★".repeat(Math.round(p.rating)) + "☆".repeat(5 - Math.round(p.rating));
      const isUnstitched = p.category !== "home";
      const sizes = p.category === "home" ? ["Single", "Double", "King"] : p.category === "kids" ? ["2–4 Y", "5–7 Y", "8–10 Y", "11–12 Y"] : null;
      const perUnit = p.category === "home" ? "Set" : p.pieces === 1 ? "Suit length (4.5 m)" : `${p.pieces}-piece suit`;
      const saved = getWishlist().includes(p.id);

      $("#product").innerHTML = `
        <div class="gallery">
          <div class="gallery__thumbs">${views.map((v, i) => `<button class="${i === 0 ? "is-active" : ""}" data-view="${i}" aria-label="View ${i + 1}">${swatch(v)}</button>`).join("")}</div>
          <div class="gallery__main" id="galleryMain">${swatch(p, p.fabric)}</div>
        </div>
        <div class="pd">
          <div class="pd__cat">${catName(p.category)} · ${p.fabric} · ${p.collection}</div>
          <h1>${p.name}</h1>
          ${priceHtml(p)}
          <div class="pd__tax">Inclusive of all taxes · ${perUnit}</div>
          <div class="pd__rating"><span class="stars">${stars}</span><span>${p.rating.toFixed(1)}</span><span style="color:var(--ink-3)">(${p.reviews} reviews)</span></div>
          <p class="pd__desc">${p.description}</p>

          <div class="pd__opt">
            <div class="pd__opt-label">Colour <span id="colorName">${p.colors.length} option${p.colors.length > 1 ? "s" : ""}</span></div>
            <div class="color-opts">${p.colors.map((c, i) => `<button class="color-opt${i === 0 ? " is-active" : ""}" data-color="${c}" style="background:${c}" aria-label="Colour ${i + 1}"></button>`).join("")}</div>
          </div>
          ${sizes ? `<div class="pd__opt"><div class="pd__opt-label">Size <span>Select one</span></div><div class="size-opts">${sizes.map((s, i) => `<button class="size-opt${i === 0 ? " is-active" : ""}" data-size="${s}">${s}</button>`).join("")}</div></div>` : ""}

          <div class="pd__buy">
            <div class="qty"><button id="qtyMinus" aria-label="Decrease">−</button><span id="qtyVal">1</span><button id="qtyPlus" aria-label="Increase">+</button></div>
            <button class="btn btn--primary" id="addBtn">Add to bag — <span id="addTotal">${money(p.price)}</span></button>
          </div>
          <button class="btn btn--outline btn--block" id="wishBtn">${saved ? "♥ Saved to wishlist" : "♡ Add to wishlist"}</button>
          <div class="pd__stock">${p.badge === "low" ? "Only a few pieces left" : "In stock — ships in 1–2 working days"}</div>

          <ul class="pd__perks">
            <li><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/></svg>Free delivery on orders above PKR 3,000</li>
            <li><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>Cash on delivery available nationwide</li>
            <li><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2"/></svg>7-day easy exchange</li>
          </ul>

          <div class="accordion">
            <details open><summary>Details</summary><div class="accordion__body"><ul>
              <li><strong>Fabric:</strong> ${p.fabric}</li>
              ${isUnstitched ? `<li><strong>Includes:</strong> ${p.pieces === 3 ? "Shirt 3 m, Dupatta 2.5 m, Trouser 2.5 m" : p.pieces === 2 ? "Shirt 3 m, Trouser 2.5 m" : "4.5 m unstitched suit length"}</li>` : `<li><strong>Includes:</strong> ${p.description.split(".")[0]}</li>`}
              <li><strong>Collection:</strong> ${p.collection}</li>
              <li><strong>Product code:</strong> ${p.id.toUpperCase()}</li></ul></div></details>
            <details><summary>Care instructions</summary><div class="accordion__body"><ul><li>Dry clean recommended for first wash</li><li>Gentle machine wash in cold water thereafter</li><li>Do not bleach; iron on reverse side</li><li>Colours may vary slightly from screen</li></ul></div></details>
            <details><summary>Shipping &amp; returns</summary><div class="accordion__body">Orders are dispatched within 1–2 working days and delivered across Pakistan in 2–5 days. Exchanges are accepted within 7 days of delivery for unused fabric with tags intact. <a href="contact.html#faq" style="text-decoration:underline">Read our full policy</a>.</div></details>
          </div>
        </div>`;

      // Interactions
      let qty = 1, color = p.colors[0], size = sizes ? sizes[0] : null;
      const updateTotal = () => { $("#qtyVal").textContent = qty; $("#addTotal").textContent = money(p.price * qty); };
      $("#qtyMinus").addEventListener("click", () => { qty = Math.max(1, qty - 1); updateTotal(); });
      $("#qtyPlus").addEventListener("click", () => { qty = Math.min(10, qty + 1); updateTotal(); });
      $$("[data-view]").forEach((b) => b.addEventListener("click", () => { $$("[data-view]").forEach((x) => x.classList.remove("is-active")); b.classList.add("is-active"); $("#galleryMain").innerHTML = swatch(views[b.dataset.view], p.fabric); }));
      $$("[data-color]").forEach((b) => b.addEventListener("click", () => { $$("[data-color]").forEach((x) => x.classList.remove("is-active")); b.classList.add("is-active"); color = b.dataset.color; $("#galleryMain").innerHTML = swatch({ ...p, colors: [color, ...p.colors.filter((c) => c !== color)] }, p.fabric); }));
      $$("[data-size]").forEach((b) => b.addEventListener("click", () => { $$("[data-size]").forEach((x) => x.classList.remove("is-active")); b.classList.add("is-active"); size = b.dataset.size; }));
      $("#addBtn").addEventListener("click", () => window.binarAddToCart(p.id, qty, { color, size }));
      $("#wishBtn").addEventListener("click", () => {
        // Reuse the global wishlist toggle via a hidden trigger element
        const tmp = document.createElement("button"); tmp.dataset.wish = p.id; tmp.hidden = true; document.body.appendChild(tmp); tmp.click(); tmp.remove();
        $("#wishBtn").textContent = getWishlist().includes(p.id) ? "♥ Saved to wishlist" : "♡ Add to wishlist";
      });

      // Related products: same category first, then same fabric
      const related = PRODUCTS.filter((x) => x.id !== p.id).sort((a, b) => ((b.category === p.category) + (b.fabric === p.fabric)) - ((a.category === p.category) + (a.fabric === p.fabric))).slice(0, 4);
      $("#related").innerHTML = related.map(productCard).join("");
      $("#relatedLink").href = `shop.html?cat=${p.category}`;
    };
  </script>
  <script src="js/main.js"></script>
</body>
</html>
